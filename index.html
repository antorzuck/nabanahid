<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>
    
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }
        .heartbeat {
            animation: heartbeat 0.6s ease-in-out;
        }
        .no-button {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background-image: url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/IMG-20260207-WA0002-Nmwn1Xlpub186weiGJQ07kDzUbp43f.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">
    <div class="w-full max-w-md">
        <!-- Main Container -->
        <div id="mainContainer" class="text-center">
            <!-- Floating Hearts -->
            <div class="mb-8 text-5xl float-animation">
                ❤️ 💕 🌹
            </div>

            <!-- Question -->
            <h1 class="text-4xl md:text-5xl font-bold text-rose-700 mb-4 drop-shadow-lg">
                Will you be my Valentine?
            </h1>

            <!-- Subtext -->
            <p class="text-lg text-rose-600 mb-12 font-light">
                I promise to make it special ✨
            </p>

            <!-- Buttons Container -->
            <div class="flex justify-between items-center  gap-6 relative h-24">
                <!-- Yes Button -->
                <button 
                    id="yesBtn"
                    class="px-8 py-3 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold rounded-full text-lg hover:shadow-lg transform hover:scale-105 transition-all duration-300 absolute left-1/2 -translate-x-1/2"
                    style="width: 120px;"
                >
                    YES
                </button>

                <!-- No Button -->
                <button 
                    id="noBtn"
                    class="no-button px-8 py-3 bg-gradient-to-r from-blue-400 to-cyan-500 text-white font-bold rounded-full text-lg hover:shadow-lg transition-all duration-300 absolute left-1/2 translate-x-1/4"
                    style="width: 120px;"
                >
                    No
                </button>
            </div>
        </div>

        <!-- Sad Cat Container (hidden by default) -->
        <div id="sadCatContainer" class="hidden text-center">
            <div class="mb-6">
                <img 
                    src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/cat-gun-CKWR1whLdPyG2Da6RKUQAKIyvLx1ES.png" 
                    alt="Sad cat"
                    class="w-48 h-48 mx-auto rounded-lg shadow-xl"
                >
            </div>
            <p class="text-3xl font-bold text-rose-700 mb-6 drop-shadow-lg">
              I hate to hear no😒❌
            </p>
            <p class="text-lg text-rose-600 mb-8">
               
            </p>
        </div>

        <!-- Love You Container (hidden by default) -->
        <div id="loveContainer" class="hidden text-center">
            <div class="text-7xl mb-8 float-animation">
                💕
            </div>
            <h2 class="text-5xl md:text-6xl font-bold text-rose-700 mb-4 drop-shadow-lg heartbeat">
                Love You Too! 💘
            </h2>
            <p class="text-2xl text-rose-600 mb-8 font-light">
                You just made me the happiest! 🎉
            </p>
            <button 
                id="restartBtn"
                class="px-6 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-full transition-all duration-300"
            >
                Start Over
            </button>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContainer = document.getElementById('mainContainer');
        const sadCatContainer = document.getElementById('sadCatContainer');
        const loveContainer = document.getElementById('loveContainer');
        const restartBtn = document.getElementById('restartBtn');

        // Yes Button Click
        yesBtn.addEventListener('click', () => {
            mainContainer.classList.add('hidden');
            loveContainer.classList.remove('hidden');
            
            // Confetti animation
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            
            // More confetti bursts
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.5 }
                });
            }, 200);

            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.5 }
                });
            }, 400);
        });

        // No Button Click
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            noClickCount++;

            if (noClickCount < 3) {
                // Move button to random position
                const randomX = Math.random() * 400 - 100;
                const randomY = Math.random() * 250 - 75;
                noBtn.style.transform = `translate(calc(-50% + ${randomX}px), ${randomY}px)`;
            } else if (noClickCount === 3) {
                // Show sad cat image
                mainContainer.classList.add('hidden');
                sadCatContainer.classList.remove('hidden');

                // Hide sad cat after 4 seconds and show main again
                setTimeout(() => {
                    sadCatContainer.classList.add('hidden');
                    mainContainer.classList.remove('hidden');
                    noClickCount = 0;
                    noBtn.style.transform = 'translate(25%, 0)';
                }, 4000);
            }
        });

        // Restart Button
        restartBtn.addEventListener('click', () => {
            loveContainer.classList.add('hidden');
            mainContainer.classList.remove('hidden');
            noClickCount = 0;
            noBtn.style.transform = 'translate(25%, 0)';
        });

        // Hover effect for Yes button - grows when No button is near
        noBtn.addEventListener('mouseenter', () => {
            yesBtn.style.transform = 'scale(1.15)';
        });

        noBtn.addEventListener('mouseleave', () => {
            yesBtn.style.transform = 'scale(1)';
        });
    </script>
</body>
</html>
